# wxl-graphics-fog: "dead world". Two layers. The atmosphere hangs everywhere: a cold, grey-green haze
# that swallows the distance, dims the sky and holds every lamp's glow in the air. Under it the lying
# fog brings the relief: it runs down every slope, fills every hollow, climbs off deep pools in soft
# billows and never quite leaves. Nights are dark; lamps and fires are what you see by.
# Copy to Extensions\wxl-graphics-fog\wxl-graphics-fog.cfg. Unset keys keep the defaults of
# wxl-graphics-fog.cfg.example.

# ============================================================ Switches and quality
WXL_FOG_ENABLED=1
WXL_FOG_QUALITY=high
WXL_FOG_INTENSITY=1.0
WXL_FOG_TEMPORAL=0.9
WXL_FOG_DITHER=1
WXL_FOG_NATIVE_FOG=1

# ============================================================ The rivers: fog forms fast at night,
# thickest in hollows and over water, drains visibly down the slopes and lingers through the day.
WXL_FOG_SIM=1
WXL_FOG_SIM_SOURCE=3.0
WXL_FOG_SIM_DAY_SOURCE=0.35
WXL_FOG_SIM_HOLLOW_SOURCE=1.5
WXL_FOG_SIM_WATER_SOURCE=2.5
WXL_FOG_SIM_DRAINAGE=6
WXL_FOG_SIM_MAX_SPEED=12
WXL_FOG_SIM_WIND_PUSH=0.03
WXL_FOG_SIM_DECAY=0.6
WXL_FOG_SIM_SUN_DECAY=1.0
WXL_FOG_SIM_WIND_DECAY=0.4
WXL_FOG_SIM_POOL_DEPTH=26
# Half again faster than real time, so the motion reads without waiting.
WXL_FOG_SIM_TIME_SCALE=1.5
WXL_FOG_SIM_RATE=20
WXL_FOG_SIM_INITIAL_FILL=0.7

# ============================================================ Light (global)
WXL_FOG_TERRAIN_SHADOW=1.0
WXL_FOG_WORLD_SHADOWS=1
WXL_FOG_WORLD_SHADOW=0.9
WXL_FOG_MS_OCTAVES=2

# ============================================================ Lamps, indoor air, effects
WXL_FOG_LAMPS=1
WXL_FOG_OMNI_SHADOWS=1
WXL_FOG_OMNI_BIAS=0.15
WXL_FOG_INDOOR_DETECT=1
WXL_FOG_INDOOR_TRANSITION=5
WXL_FOG_WAKES=1
WXL_FOG_WAKE_RANGE=50
WXL_FOG_PROJECTILES=1
WXL_FOG_PLUMES=1
WXL_FOG_HEAT_ENABLED=1
WXL_FOG_IMMERSION_ENABLED=1

# ============================================================ The atmosphere: the mood everywhere
# About 100 yards to half the light at eye level, thinning over 35 yards of height, following the land
# more than not, in slow patches that drift with the wind.
WXL_FOG_AIR_DENSITY=0.007
WXL_FOG_AIR_HEIGHT=35
WXL_FOG_AIR_BASE=3
WXL_FOG_AIR_FOLLOW=0.6
WXL_FOG_AIR_NOISE=0.45
WXL_FOG_AIR_NOISE_SCALE=160
# Mostly the fog's grey-green; a soft forward glow; lamps glow in it.
WXL_FOG_AIR_COLOR_SHARE=0.7
WXL_FOG_AIR_ANISOTROPY=0.45
WXL_FOG_AIR_SUN=0.9
WXL_FOG_AIR_MOON=0.8
WXL_FOG_AIR_SKY=0.9
WXL_FOG_AIR_LAMP=1.0

# ============================================================ The lying fog: where it lies
# A notch lighter than before in the rivers and pools, a knee-to-waist mist everywhere; the haze to
# the horizon is left to the atmosphere.
WXL_FOG_DENSITY=0.13
WXL_FOG_GROUND_DENSITY=0.022
WXL_FOG_GROUND_HEIGHT=7
# Deep pools climb 8 yards higher in soft billows.
WXL_FOG_CLIMB=8
WXL_FOG_HAZE_DENSITY=0.001
WXL_FOG_HAZE_HEIGHT=28
WXL_FOG_HAZE_FALLOFF=0.02
# Wide banks over most of the land, opening a few gaps.
WXL_FOG_BANK_COVERAGE=0.72
WXL_FOG_BANK_STRENGTH=0.65
WXL_FOG_BANK_SCALE=260

# ============================================================ The lying fog: substance
WXL_FOG_SHAPE_SCALE=3.5
WXL_FOG_SHAPE_CONTRAST=0.85
WXL_FOG_DENSE_CONTRAST=0.4
WXL_FOG_TOP_SOFTNESS=1.8
WXL_FOG_TOP_BILLOW=0.9
# Finer, curlier fraying.
WXL_FOG_DETAIL_SCALE=0.6
WXL_FOG_EROSION=0.7
WXL_FOG_CURL=0.7

# ============================================================ The lying fog: motion
WXL_FOG_RENEWAL=10
WXL_FOG_WIND_SPEED=0.9
WXL_FOG_WIND_DIRECTION=200
WXL_FOG_TURBULENCE=0.55
WXL_FOG_LAYER_FLOW=1.2

# ============================================================ The lying fog: light and colour
# Grey-green, cold; the zone's own fog colour still shows through a little.
WXL_FOG_COLOR_MODE=blend
WXL_FOG_COLOR=848E84
WXL_FOG_COLOR_BLEND=0.65
WXL_FOG_BRIGHTNESS=0.95
# A sky light that dies in the valleys, and dark nights.
WXL_FOG_AMBIENT=0.8
WXL_FOG_AMBIENT_FLOOR=0.05
WXL_FOG_VALLEY_DARKENING=2.0
WXL_FOG_ZONE_TINT=0.4
WXL_FOG_SUN_SCATTER=0.85
WXL_FOG_MOON_SCATTER=0.6
WXL_FOG_LAMP_SCATTER=1.4
WXL_FOG_ANISOTROPY=0.6
WXL_FOG_BACK_ANISOTROPY=-0.25
WXL_FOG_LOBE_BLEND=0.2
# Heavy bodies: dark bellies, bright soft tops.
WXL_FOG_POWDER=0.5
WXL_FOG_MS_STRENGTH=0.6
WXL_FOG_SELF_SHADOW=1.4
WXL_FOG_SKY_SHADOW=0.8
WXL_FOG_EXPOSURE=0.9
WXL_FOG_SOFT_WHITE=1.8

# ============================================================ The lying fog: effects
WXL_FOG_SMOKE=1.3
WXL_FOG_FIRE_SMOKE=0.5
WXL_FOG_SMOKE_DARKNESS=0.7
WXL_FOG_HEAT=0.6
WXL_FOG_WAKE_STRENGTH=0.85
WXL_FOG_WAKE_RADIUS=1.1
WXL_FOG_WAKE_PUSH=1.8
WXL_FOG_PROJECTILE_CARVE=0.95
WXL_FOG_PROJECTILE_RADIUS=1.3
WXL_FOG_PROJECTILE_HOLD=0.6
WXL_FOG_PROJECTILE_REFILL=6
WXL_FOG_TRAIL_BILLOW=1.2
WXL_FOG_IMMERSION=0.85
WXL_FOG_IMMERSION_BLUR=0.6

# ============================================================ Indoor: stale, dusty, lamp-lit
WXL_FOG_INDOOR_DENSITY=0.022
WXL_FOG_INDOOR_FLOOR_HAZE=1.2
WXL_FOG_INDOOR_FLOOR_HAZE_HEIGHT=1.5
WXL_FOG_INDOOR_NOISE_STRENGTH=0.6
WXL_FOG_INDOOR_NOISE_SCALE=6
WXL_FOG_INDOOR_DRIFT=0.12
WXL_FOG_INDOOR_SEEP=0.9
WXL_FOG_INDOOR_COLOR_MODE=custom
WXL_FOG_INDOOR_COLOR=9A8A78
WXL_FOG_INDOOR_BRIGHTNESS=0.85
WXL_FOG_INDOOR_AMBIENT=0.3
WXL_FOG_INDOOR_LAMP_SCATTER=2.0
WXL_FOG_INDOOR_ANISOTROPY=0.45
WXL_FOG_INDOOR_BACK_ANISOTROPY=-0.15
WXL_FOG_INDOOR_LOBE_BLEND=0.2
