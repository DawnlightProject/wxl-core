# DXVK 3.1.1 settings for WoW 3.3.5a. The d3d9 proxy points DXVK here (DXVK_CONFIG_FILE) when
# WXL_D3D9_BACKEND=dxvk loads the d3d9.dll beside this file.
# Runs on the dedicated NVIDIA GPU, not an integrated one.
dxvk.deviceFilter = "NVIDIA"
# 32-bit address space: DXVK's own default (d3d9.textureMemory = 100) already unmaps locked
# texture data, so nothing is set for it here.
